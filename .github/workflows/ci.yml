name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-extras.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-extras.txt
      - name: Run test suite (real demo experiments, no mock engines)
        run: pytest tests -q
        env:
          ADMIN_EMAIL: admin@test.lab
          ADMIN_PASSWORD: test-admin-pass
          DATA_DIR: .test_data

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build (type-check + production bundle)
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: cpc-lab/api:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
          tags: cpc-lab/frontend:ci
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
