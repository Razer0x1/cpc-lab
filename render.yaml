# Render blueprint — CPC Lab backend (long-running FastAPI engine).
# The experiment runner uses in-process background threads, so the API must run as
# a container on a host that supports them (Render/Railway/Fly/VPS). Vercel
# serverless cannot host this part — the Vercel project hosts the Next.js frontend
# and points NEXT_PUBLIC_API_URL at this service.
#
# Data: the free Render tier has no persistent disk, so state lives in a free
# hosted Postgres (e.g. Neon) via DATABASE_URL. Only generated artifact files in
# DATA_DIR are per-instance/ephemeral; every measurement lives in the database.
#
# Deploy: push this repo to GitHub → render.com → New + → Blueprint → select repo.
services:
  - type: web
    name: cpc-lab-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      #postgresql://<user>:<password>@<host>/<db>?sslmode=require  (Neon/Supabase)
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: ADMIN_EMAIL
        value: admin@cpc.lab
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_PUBLIC_REGISTRATION
        value: "true"
      # After the Vercel deploy exists, set this to e.g.
      # https://cpc-lab-<vercel-id>.vercel.app (Dashboard → Environment) and redeploy.
      - key: CORS_ORIGINS
        sync: false
